<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>习作批改助手 · 对话式批改机器人</title>
<meta name="description" content="对话式作文批改机器人:先告诉它你是老师还是学生,再把习作发给它(文字或照片),它会对照统编版五年级单元训练点给出批改意见。老师得到结构化批改报告,学生得到提问引导,绝不代写。">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 页面只做一件事:把对话框放在中间。所有操作——认身份、收习作、
     选单元、发照片、确认识别结果、改设置——都在对话里完成。 -->
<header class="top">
  <div class="brand">
    <h1>习作批改助手</h1>
    <span class="tagline">统编版五年级 · 16 个习作单元 · 对话式批改</span>
  </div>
</header>

<main class="chatwrap">
  <section class="panel chat-panel">
    <div class="msglist" id="msgList"></div>

    <div class="composer">
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <div class="inputrow">
        <button type="button" class="attach" id="imgBtn" aria-label="把习作照片发给我" title="把习作照片发给我">＋</button>
        <textarea id="input" rows="1" placeholder="打字告诉我你是老师还是学生,或把习作贴在这里…(Enter 发送,Shift+Enter 换行)"></textarea>
        <button type="button" id="sendBtn" class="primary">发送</button>
      </div>
      <p class="ai-line" id="aiLine"></p>
    </div>
  </section>
</main>

<!-- 图片放大:点对话里的缩略图看大图 -->
<div class="zoom" id="zoomBox" hidden>
  <img id="zoomImg" alt="习作图片放大预览">
  <p class="zoom-tip">点击任意处关闭</p>
</div>

<!-- 接口设置:默认走平台免密钥通道,自带密钥可覆盖。
     只保留这一个弹层 —— 密钥必须用密码框输入,不能写成对话消息。
     入口也只在对话里(说一句"设置"),界面上不出现独立按钮。 -->
<div class="modal" id="setModal" hidden>
  <div class="modal-box">
    <header class="modal-head">
      <b>大模型接口设置</b>
      <button type="button" id="setClose" class="iconbtn" aria-label="关闭">×</button>
    </header>
    <div class="modal-body">
      <p class="hint">默认走<b>平台免密钥通道</b>,打开就能用,不需要你填任何东西。下面这一栏是可选的覆盖:填了自己的,就优先用你自己的。</p>

      <div class="chline" id="chLine"></div>

      <label class="sw"><input type="checkbox" id="aiOn"> 用我自己的接口(覆盖平台通道)</label>

      <div class="row">
        <div class="field">
          <label>服务商</label>
          <select id="aiPreset"></select>
          <span class="subnote" id="aiPresetNote"></span>
        </div>
        <div class="field">
          <label>表达风格</label>
          <select id="aiTemp"></select>
        </div>
      </div>

      <div class="field">
        <label>接口地址(Base URL)</label>
        <input type="text" id="aiBase" placeholder="https://api.deepseek.com/v1,或自建代理 /api/llm" autocomplete="off">
      </div>

      <div class="field">
        <label>模型名(文字)</label>
        <input type="text" id="aiModel" placeholder="deepseek-chat" autocomplete="off">
      </div>

      <div class="field">
        <label>模型名(图片文字识别)</label>
        <input type="text" id="aiVision" placeholder="留空则用平台通道的识图模型" autocomplete="off">
        <span class="subnote" id="aiVisionNote"></span>
      </div>

      <div class="field">
        <label>API Key</label>
        <input type="password" id="aiKey" placeholder="粘贴你自己的密钥,例如 sk-..." autocomplete="off">
        <label class="sw small"><input type="checkbox" id="aiSession"> 只保存在本次会话(关闭浏览器即清除)</label>
      </div>

      <div class="actions">
        <button type="button" id="aiTest" class="ghost">测试连接</button>
        <button type="button" id="aiTestVision" class="ghost">测试识图</button>
        <button type="button" id="aiSave" class="primary">保存</button>
      </div>
      <div class="actions">
        <button type="button" id="aiClear" class="ghost">清除密钥</button>
      </div>

      <p class="ai-msg" id="aiMsg"></p>

      <p class="privacy">填在这里的密钥只保存在你自己的浏览器里,请求直接发往你填写的接口地址,不经过本应用的任何服务器。不填则走平台通道,同样不在前端保存任何密钥。</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js" defer></script>
<script src="kb.js"></script>
<script src="engine.js"></script>
<script src="img.js"></script>
<script src="cloud.js"></script>
<script src="llm.js"></script>
<script src="ui.js"></script>
<script src="chat.js"></script>
</body>
</html>
